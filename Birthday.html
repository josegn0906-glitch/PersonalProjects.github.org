```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(#2b1b3d, #1d1130);
}

#stage {
  position: relative;
  z-index: 2;
}

.cake {
  width: 230px;
  margin: auto;
  position: relative;
}

.candles {
  display: flex;
  justify-content: center;
  gap: 18px;
  position: relative;
  z-index: 3;
}

.candle {
  font-size: 62px;
  font-weight: 900;
  color: #e9b94a;
  text-shadow: 0 3px 3px #000;
}

.flame {
  width: 10px;
  height: 16px;
  margin: auto;
  background: #ffd23f;
  border-radius: 50%;
  animation: flicker 0.7s infinite;
}

@keyframes flicker {
  50% {
    transform: scaleY(1.25) rotate(4deg);
  }
}

.layer {
  position: relative;
  border-radius: 12px;
  box-shadow: 0 7px 12px #0005;
}

.top,
.base {
  height: 45px;
  background: linear-gradient(#f6aecb, #e88cb0);
}

.middle {
  height: 55px;
  width: 108%;
  margin-left: -4%;
  background: linear-gradient(#fceedD, #ead3b4);
}

.base {
  height: 60px;
  width: 118%;
  margin-left: -9%;
}

.plate {
  height: 14px;
  width: 138%;
  margin-left: -19%;
  background: #d8c9e8;
  border-radius: 50%;
}

.drip {
  position: absolute;
  bottom: -8px;
  width: 100%;
  height: 14px;
  background: #e88cb0;
  border-radius: 50%;
}

button {
  margin-top: 35px;
  padding: 14px 28px;
  border: none;
  border-radius: 30px;
  background: #e9b94a;
  color: #1d1130;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: translateY(-2px);
}

#message {
  min-height: 24px;
  color: #8fd9c4;
  margin: 14px;
}

canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="stage">

  <!-- CAKE -->

  <div class="cake">

    <div class="candles">

      <div>
        <div class="flame"></div>
        <div class="candle">2</div>
      </div>

      <div>
        <div class="flame"></div>
        <div class="candle">0</div>
      </div>

    </div>

    <div class="layer top">
      <div class="drip"></div>
    </div>

    <div class="layer middle"></div>

    <div class="layer base">
      <div class="drip"></div>
    </div>

    <div class="plate"></div>

  </div>


  <!-- WISH BUTTON -->

  <button id="wish">
    ✨ Click to make a wish ✨
  </button>

  <div id="message">
    Make a wish and click the button!
  </div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const button = document.getElementById("wish");
const message = document.getElementById("message");

let W;
let H;

let fireworks = [];
let balloons = [];
let letters = [];
let particles = [];

let started = false;


/* --------------------------------
   RESIZE CANVAS
-------------------------------- */

function resize() {

  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


/* --------------------------------
   COLORS
-------------------------------- */

const colors = [

  "#e9b94a",
  "#f6aecb",
  "#8fd9c4",
  "#f27b8d",
  "#b98bde",
  "#fff3d6"

];


/* --------------------------------
   CREATE LETTER POINTS
-------------------------------- */

function textPoints() {

  let offscreen = document.createElement("canvas");

  let tempCtx =
    offscreen.getContext("2d");


  let size = Math.min(
    48,
    W / 18
  );

  let text =
    "HAPPY BIRTHDAY ELLIE";


  tempCtx.font =
    `bold ${size}px Arial`;


  /* Make sure the message fits */
  while (
    tempCtx.measureText(text).width >
    W * 0.9
  ) {

    size--;

    tempCtx.font =
      `bold ${size}px Arial`;

  }


  offscreen.width = W;

  offscreen.height =
    size * 1.5;


  tempCtx.font =
    `bold ${size}px Arial`;

  tempCtx.textAlign =
    "center";

  tempCtx.textBaseline =
    "middle";


  tempCtx.fillText(

    text,

    W / 2,

    size * 0.75

  );


  let pixels =
    tempCtx.getImageData(

      0,
      0,
      W,
      offscreen.height

    ).data;


  let points = [];


  /* Move message lower */

  let lower =
    Math.min(
      150,
      H * 0.20
    );


  for (
    let y = 0;
    y < offscreen.height;
    y += 5
  ) {

    for (
      let xx = 0;
      xx < W;
      xx += 5
    ) {

      if (
        pixels[
          (y * W + xx) * 4 + 3
        ] > 100
      ) {

        points.push({

          x: xx,

          y: y + lower

        });

      }

    }

  }


  return points;

}


let targets = [];


/* --------------------------------
   FIREWORKS
-------------------------------- */

function makeFireworks() {

  targets =
    textPoints();


  targets.forEach(
    (target, index) => {

      setTimeout(() => {

        let startX =
          Math.random() * W;

        let startY =
          H + 20;


        let dx =
          target.x - startX;

        let dy =
          target.y - startY;


        let distance =
          Math.hypot(
            dx,
            dy
          );


        let speed = 9;


        fireworks.push({

          x: startX,

          y: startY,

          vx:
            dx / distance *
            speed,

          vy:
            dy / distance *
            speed,

          target: target,

          color:
            colors[
              index %
              colors.length
            ]

        });

      },

      index * 18

      );

    }

  );

}


/* --------------------------------
   BALLOONS
-------------------------------- */

function addBalloons() {

  for (
    let i = 0;
    i < 16;
    i++
  ) {

    balloons.push({

      x:
        Math.random() * W,

      y:
        H +
        Math.random() * 250,

      size:
        18 +
        Math.random() * 15,

      speed:
        0.7 +
        Math.random() * 0.8,

      color:
        colors[
          i % colors.length
        ],

      angle:
        Math.random() *
        Math.PI * 2

    });

  }

}


/* --------------------------------
   START FIREWORKS AUTOMATICALLY
-------------------------------- */

makeFireworks();


/* --------------------------------
   BUTTON
-------------------------------- */

button.onclick = () => {

  if (started)
    return;


  started = true;


  button.textContent =
    "🎂 Wish made!";


  message.textContent =
    "Happy Birthday Ellie! 🎈✨";


  addBalloons();

};


/* --------------------------------
   DRAW EVERYTHING
-------------------------------- */

function draw() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* -----------------------------
     BALLOONS
  ----------------------------- */

  balloons.forEach(
    balloon => {

      balloon.y -=
        balloon.speed;

      balloon.angle +=
        0.02;

      balloon.x +=
        Math.sin(
          balloon.angle
        ) * 0.35;


      ctx.fillStyle =
        balloon.color;

      ctx.globalAlpha =
        0.85;


      ctx.beginPath();


      ctx.ellipse(

        balloon.x,

        balloon.y,

        balloon.size * 0.72,

        balloon.size,

        0,

        0,

        Math.PI * 2

      );


      ctx.fill();


      ctx.globalAlpha = 1;


      /* Balloon string */

      ctx.strokeStyle =
        "#ffffff88";


      ctx.beginPath();


      ctx.moveTo(

        balloon.x,

        balloon.y +
        balloon.size

      );


      ctx.lineTo(

        balloon.x,

        balloon.y +
        balloon.size +
        35

      );


      ctx.stroke();

    }

  );


  /* -----------------------------
     FIREWORKS TRAVELING
  ----------------------------- */

  fireworks.forEach(
    (firework, index) => {

      firework.x +=
        firework.vx;

      firework.y +=
        firework.vy;


      let distance =
        Math.hypot(

          firework.target.x -
            firework.x,

          firework.target.y -
            firework.y

        );


      /* Firework reaches letter */

      if (distance < 10) {

        /* Permanently save the letter point */

        letters.push({

          x:
            firework.target.x,

          y:
            firework.target.y,

          color:
            firework.color

        });


        /* Explosion */

        for (
          let n = 0;
          n < 5;
          n++
        ) {

          particles.push({

            x:
              firework.target.x,

            y:
              firework.target.y,

            vx:
              (Math.random() - 0.5) * 4,

            vy:
              (Math.random() - 0.5) * 4,

            life: 1,

            color:
              firework.color

          });

        }


        fireworks.splice(
          index,
          1
        );


        return;

      }


      /* Draw flying firework */

      ctx.fillStyle =
        firework.color;


      ctx.beginPath();


      ctx.arc(

        firework.x,

        firework.y,

        2,

        0,

        Math.PI * 2

      );


      ctx.fill();

    }

  );


  /* -----------------------------
     PERMANENT LETTERS
  ----------------------------- */

  letters.forEach(
    letter => {

      ctx.globalAlpha = 1;

      ctx.fillStyle =
        letter.color;


      ctx.beginPath();


      ctx.arc(

        letter.x,

        letter.y,

        1.7,

        0,

        Math.PI * 2

      );


      ctx.fill();

    }

  );


  ctx.globalAlpha = 1;


  /* -----------------------------
     EXPLOSION PARTICLES
  ----------------------------- */

  particles.forEach(
    (particle, index) => {

      particle.x +=
        particle.vx;

      particle.y +=
        particle.vy;


      particle.life -=
        0.025;


      ctx.globalAlpha =
        particle.life;

      ctx.fillStyle =
        particle.color;


      ctx.beginPath();


      ctx.arc(

        particle.x,

        particle.y,

        2,

        0,

        Math.PI * 2

      );


      ctx.fill();


      if (
        particle.life <= 0
      ) {

        particles.splice(
          index,
          1
        );

      }

    }

  );


  ctx.globalAlpha = 1;


  requestAnimationFrame(
    draw
  );

}


/* Start animation */

draw();

</script>

</body>
</html>
